<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Open Houses</title>
        <link rel="stylesheet" href="/styles.css">
        
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display&display=swap" rel="stylesheet">

        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    </head>

    <body>
        <div id="modal" onclick="document.getElementById('modal').style.visibility='hidden';">
            <div class="modal-container" onclick="event.stopPropagation();">
                <form id="loginForm" onsubmit="login(event)">
                    <input type="text" id="username" name="username" placeholder="username" autocomplete="off" required>
                    <input type="password" id="password" name="password" placeholder="password" autocomplete="off" required>
                    <button type="submit" id="continue-btn" aria-label="Continue">
                        <img src="/assets/transfer-in.svg" alt="" width="30px" draggable="false" />
                    </button>
                </form>
            </div>
        </div>
        
        <div id="header">
            <a id="home-btn" href="/" aria-label="Home">
                <img src="/assets/door.svg" alt="" width="30px" draggable="false" />
            </a>
            <button id="signup-or-login-btn" onclick="document.getElementById('modal').style.visibility='visible';" aria-label="Sign up or log in">
                <img src="/assets/key.svg" alt="" width="30px" draggable="false" />
            </button>
        </div>

        <form id="searchForm" onsubmit="search(event)">
            <div class="flex-col">
                <label for="location">City or ZIP Code</label>
                <input type="text" id="location" name="location" value="San Francisco" required>
            </div>
            <div>
                <select id="listingstatus" name="listingstatus" aria-label="listingstatus" required>
                    <option selected disabled value="">Listing Status</option>
                    <option value="For_Sale">Sale</option>
                    <option value="For_Rent">Rent</option>
                </select>
            </div>
            <div class="flex-col">
                <label for="min">Min</label>
                <input class="no-spinner" type="number" inputmode="numeric" pattern="[0-9]*" id="min" name="min" value="400000" required>
                <label for="max">Max</label>
                <input class="no-spinner" type="number" inputmode="numeric" pattern="[0-9]*" id="max" name="max" value="700000" required>
            </div>
            <fieldset>
                <legend>Tours:</legend>

                <div>
                    <input class="checkbox" type="checkbox" id="tourOpenHouse" name="tourOpenHouse" checked />
                    <label for="tourOpenHouse">Must have open house</label>
                </div>

                <div>
                    <input class="checkbox" type="checkbox" id="tour3D" name="tour3D" />
                    <label for="tour3D">Must have 3D Tour</label>
                </div>
            </fieldset>
            <button type="submit" id="search-btn" aria-label="Search">
                <img src="/assets/search.svg" alt="" width="30px" draggable="false" />
            </button>
        </form>

        <div id="results"></div>

        <script>
            const auth = {
                loggedIn: false,
                name: "",
                userId: null,
                currentList: [],
                savedLists: []
            };

            const parts = window.location.pathname.split("/").slice(1);
            const name = parts[0];
            const slug = parts[1];
            if (name && slug) {
                document.body.classList.add("shareable-page");
                loadList(name, slug);
            }

            window.addEventListener("popstate", () => {
                const parts = window.location.pathname.split("/").slice(1);

                const name = parts[0];
                const slug = parts[1];

                if (name && slug) {
                    loadList(name, slug);
                } else if (auth.loggedIn) {
                    renderSavedLists();
                }
            });

            async function login(e) {
                e.preventDefault();
                
                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;

                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                });

                const data = await res.json();

                if (!res.ok) {
                    document.getElementById("password").value = "";
                    document.getElementById("password").focus();
                    alert(data.error);
                    return;
                }

                history.pushState({}, "", `/`);  // reset URL if user logs in from a shareable list page

                auth.loggedIn = true;
                auth.name = data.user.name;
                auth.userId = data.user.id;
                auth.currentList = [];
                auth.savedLists = data.lists;
                document.getElementById("searchForm").style.display = "none";
                document.getElementById("header").innerHTML = `
                    <button id="searchToggle" onclick="document.getElementById('searchForm').classList.toggle('block')">Search</button>
                    <p>Welcome, ${auth.name}!</p>
                `;
                document.getElementById("modal").remove();
                renderSavedLists();
            }

            async function search(e) {
                e.preventDefault();
                
                const location = document.getElementById("location").value;
                const listingstatus = document.getElementById("listingstatus").value;
                const min = document.getElementById("min").value;
                const max = document.getElementById("max").value;
                const tourOpenHouse = document.getElementById("tourOpenHouse").checked;
                const tour3D = document.getElementById("tour3D").checked;

                const res = await fetch("/api/search", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ location, listingstatus, min, max, tourOpenHouse, tour3D }),
                });

                const data = await res.json();

                renderListings(data);
            }


            function renderSavedLists() {
                const container = document.getElementById("results");
                container.innerHTML = "<h2>Saved Lists</h2>";

                if (!Array.isArray(auth.savedLists) || auth.savedLists.length === 0) {
                    container.innerHTML += "<h4>No saved lists found.</h4>";
                    return;
                }
                [...auth.savedLists].reverse().forEach((list) => {
                    const listTitle = document.createElement("a");
                    listTitle.className = "list-title";
                    listTitle.textContent = list.title;
                    listTitle.href = `/${auth.name}/${list.slug}`;
                    listTitle.addEventListener("click", (e) => {
                        e.preventDefault();

                        history.pushState({}, "", listTitle.href);

                        loadList(auth.name, list.slug);
                    });
                    container.appendChild(listTitle);

                    list.list.forEach((listing) => {
                        const card = document.createElement("div");
                        card.className = "listing-card";

                        const zpid = listing.zpid;
                        if (!zpid) {
                            return;
                        }
                        const mapId = `map-${zpid}`;
                        card.innerHTML = `
                            <p>
                                ${listing.price ? new Intl.NumberFormat("en-US", {
                                    style: "currency",
                                    currency: "USD",
                                    maximumFractionDigits: 0
                                }).format(listing.price) : "Price not available"}
                            </p>
                            <h3>${listing.address ? `<a href="https://www.zillow.com/homedetails/${zpid}_zpid/" target="_blank">${listing.address}</a>` : "Address not available"}</h3>
                            <p>${listing.type ? listing.type : "Type not available"}</p>
                            <p>${listing.sqft ? `${listing.sqft} sqft` : "Size not available"}</p>

                            <div class="fade"></div>
                            <div id="${mapId}" class="map"></div>
                        `;
                        container.appendChild(card);

                        const latitude = listing.latitude;
                        const longitude = listing.longitude;
                        if (latitude != null && longitude != null) {
                            const map = L.map(mapId, {
                                zoomControl: false
                            }).setView([latitude, longitude], 13);

                            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                                attribution: "&copy; OpenStreetMap contributors"
                            }).addTo(map);

                            L.marker([latitude, longitude]).addTo(map);
                        }
                    });
                });
            }

            function renderShareableList(name, data) {
                if (document.getElementById("home-btn")) {
                    document.getElementById("home-btn").style.display = "block";
                }

                const container = document.getElementById("results");
                container.innerHTML = `
                    <h2>${name}'s list: ${data.title}</h2>
                `;

                data.list.forEach((listing) => {
                    const card = document.createElement("div");
                    card.className = "listing-card";

                    const zpid = listing.zpid;
                    if (!zpid) {
                        return;
                    }
                    const mapId = `map-${zpid}`;
                    card.innerHTML = `
                        <p>
                            ${listing.price ? new Intl.NumberFormat("en-US", {
                                style: "currency",
                                currency: "USD",
                                maximumFractionDigits: 0
                            }).format(listing.price) : "Price not available"}
                        </p>
                        <h3>${listing.address ? `<a href="https://www.zillow.com/homedetails/${zpid}_zpid/" target="_blank">${listing.address}</a>` : "Address not available"}</h3>
                        <p>${listing.type ? listing.type : "Type not available"}</p>
                        <p>${listing.sqft ? `${listing.sqft} sqft` : "Size not available"}</p>

                        <div class="fade"></div>
                        <div id="${mapId}" class="map"></div>
                    `;
                    container.appendChild(card);

                    const latitude = listing.latitude;
                    const longitude = listing.longitude;
                    if (latitude != null && longitude != null) {
                        const map = L.map(mapId, {
                            zoomControl: false
                        }).setView([latitude, longitude], 13);

                        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                            attribution: "&copy; OpenStreetMap contributors"
                        }).addTo(map);

                        L.marker([latitude, longitude]).addTo(map);
                    }
                });
            }

            function renderListings(data) {
                const container = document.getElementById("results");
                container.innerHTML = "";

                const card = document.createElement("div");
                card.innerHTML = `
                    <p>Each page displays up to ${data.pagesInfo.resultsPerPage} listings.</p>
                    <p>Page: ${data.pagesInfo.currentPage}/${data.pagesInfo.totalPages}</p>
                    <p>Total Listings: ${data.resultsCount.totalMatchingCount}</p>
                    <div id="save-list-ui"></div>
                `;
                container.appendChild(card);

                if (!Array.isArray(data?.searchResults) || data.searchResults.length === 0) {
                    container.innerHTML = "<h4>No search results found.</h4>";
                    return;
                }
                data.searchResults.forEach((listing) => {
                    //console.log(listing.property.media.propertyPhotoLinks.mediumSizeLink);  //for later: add photo to the listing cards
                    const card = document.createElement("div");
                    card.className = "listing-card";

                    const zpid = listing.property?.zpid;
                    if (!zpid) {
                        return;
                    }
                    const mapId = `map-${zpid}`;
                    card.innerHTML = `
                        <p>
                            ${listing.property?.price?.value ? new Intl.NumberFormat("en-US", {
                                style: "currency",
                                currency: "USD",
                                maximumFractionDigits: 0
                            }).format(listing.property?.price?.value) : "Price not available"}
                        </p>
                        <h3>${listing.property?.address?.streetAddress ? `<a href="https://www.zillow.com/homedetails/${zpid}_zpid/" target="_blank">${listing.property?.address?.streetAddress}</a>` : "Address not available"}</h3>
                        <p>${listing.property?.propertyType ? listing.property?.propertyType : "Type not available"}</p>
                        <p>${listing.property?.livingArea ? `${listing.property?.livingArea} sqft` : "Size not available"}</p>

                        <div class="fade"></div>
                        <div id="${mapId}" class="map"></div>
                    `;

                    if (auth.loggedIn) {
                        const checkbox = document.createElement("input");
                        checkbox.type = "checkbox";

                        checkbox.addEventListener("change", () => {
                            if (checkbox.checked) {
                                addToList(listing);
                            } else {
                                removeFromList(listing);
                            }
                        });

                        const label = document.createElement("label");
                        label.textContent = " Save to list";

                        const wrapper = document.createElement("div");
                        wrapper.appendChild(checkbox);
                        wrapper.appendChild(label);

                        card.appendChild(wrapper);
                    }
                    container.appendChild(card);


                    const latitude = listing.property?.location?.latitude;
                    const longitude = listing.property?.location?.longitude;
                    if (latitude != null && longitude != null) {
                        const map = L.map(mapId, {
                            zoomControl: false
                        }).setView([latitude, longitude], 13);

                        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                            attribution: "&copy; OpenStreetMap contributors"
                        }).addTo(map);

                        L.marker([latitude, longitude]).addTo(map);
                    }
                });
            }

            function addToList(listing) {
                auth.currentList.push({
                    zpid: listing.property?.zpid,
                    address: listing.property?.address?.streetAddress,
                    price: listing.property?.price?.value,
                    type: listing.property?.propertyType,
                    sqft: listing.property?.livingArea,
                    latitude: listing.property?.location?.latitude,
                    longitude: listing.property?.location?.longitude
                });

                renderSaveListButton();
            }

            function removeFromList(listing) {
                const zpid = listing.property?.zpid;
                const index = auth.currentList.findIndex(i => i.zpid === zpid);

                if (index !== -1) {
                    auth.currentList.splice(index, 1);
                }

                renderSaveListButton();
            }

            function renderSaveListButton() {
                const container = document.getElementById("save-list-ui");

                if (!container) return;

                container.innerHTML = "";

                if (auth.currentList.length === 0) return;

                const button = document.createElement("button");
                button.textContent = "Save List";

                button.addEventListener("click", async () => {
                    const title = prompt("Name your list:");
                    if (!title) return;

                    await fetch("/api/save-list", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            user_id: auth.userId,
                            title,
                            slug: slugify(title),
                            list: auth.currentList
                        })
                    });

                    const res = await fetch(`/api/user/${auth.name}`);
                    auth.savedLists = await res.json();

                    alert("List saved!");
                    document.getElementById("searchToggle").click();
                    renderSavedLists();
                });

                container.appendChild(button);
            }

            async function loadList(name, slug) {
                const res = await fetch(`/api/${name}/${slug}`);
                const data = await res.json();

                renderShareableList(name, data);
            }

            function slugify(title) {
                return title
                    .toLowerCase()
                    .trim()
                    .replace(/\s+/g, "-")
                    .replace(/[^\w-]/g, "");
            }
        </script>
    </body>
</html>
