<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Open Houses</title>
        <link rel="stylesheet" href="/styles.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    </head>

    <body>
        <div class="input-fields">
            <form onsubmit="search(event)">
                <label for="location">City or ZIP Code</label>
                <input type="text" id="location" name="location" value="San Francisco" required>
                <select id="listingstatus" name="listingstatus" aria-label="listingstatus" required>
                    <option selected disabled value="">Listing Status</option>
                    <option value="For_Sale">Sale</option>
                    <option value="For_Rent">Rent</option>
                </select>
                <label for="min">Min</label>
                <input class="no-spinner" type="number" inputmode="numeric" pattern="[0-9]*" id="min" name="min" value="400000" required>
                <label for="max">Max</label>
                <input class="no-spinner" type="number" inputmode="numeric" pattern="[0-9]*" id="max" name="max" value="700000" required>
                <fieldset>
                    <legend>Tours:</legend>

                    <div>
                        <input class="checkbox" type="checkbox" id="tourOpenHouse" name="tourOpenHouse" checked />
                        <label for="tourOpenHouse">Must have open house</label>
                    </div>

                    <div>
                        <input class="checkbox" type="checkbox" id="tour3D" name="tour3D" />
                        <label for="tour3D">Must have 3D Tour</label>
                    </div>
                </fieldset>
                <button type="submit">Search</button>
            </form>

            <form onsubmit="login(event)">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <button type="submit">Login</button>
            </form>
        </div>
        <div id="results"></div>

        <script>
            async function login(e) {
                e.preventDefault();
                
                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;

                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                });

                const data = await res.json();
                console.log(data);

                renderListings(data);
            }

            async function search(e) {
                e.preventDefault();
                
                const location = document.getElementById("location").value;
                const listingstatus = document.getElementById("listingstatus").value;
                const min = document.getElementById("min").value;
                const max = document.getElementById("max").value;
                const tourOpenHouse = document.getElementById("tourOpenHouse").checked;
                const tour3D = document.getElementById("tour3D").checked;

                const res = await fetch("/api/search", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ location, listingstatus, min, max, tourOpenHouse, tour3D }),
                });

                const data = await res.json();
                //console.log(data);

                renderListings(data);
            }


            function renderListings(data) {
                const container = document.getElementById("results");
                container.innerHTML = "";

                const card = document.createElement("div");
                card.innerHTML = `
                    <p>Each page displays up to ${data.pagesInfo.resultsPerPage} listings.</p>
                    <p>Page: ${data.pagesInfo.currentPage}/${data.pagesInfo.totalPages}</p>
                    <p>Total Listings: ${data.resultsCount.totalMatchingCount}</p>
                `;
                container.appendChild(card);

                data.searchResults.forEach((listing) => {
                    const card = document.createElement("div");
                    card.className = "listing-card";

                    const mapId = `map-${listing.property.zpid}`;
                    card.innerHTML = `
                        <p>
                            ${new Intl.NumberFormat("en-US", {
                                style: "currency",
                                currency: "USD",
                                maximumFractionDigits: 0
                            }).format(listing.property.price.value)}
                        </p>
                        <h3><a href="https://www.zillow.com/homedetails/${listing.property.zpid}_zpid/" target="_blank">${listing.property.address.streetAddress}</a></h3>
                        <p>${listing.property.propertyType}</p>
                        <p>${listing.property.livingArea} sqft</p>

                        <div class="fade"></div>
                        <div id="${mapId}" class="map"></div>
                    `;
                    container.appendChild(card);


                    const latitude = listing.property.location.latitude;
                    const longitude = listing.property.location.longitude;
                    const map = L.map(mapId, {
                        zoomControl: false
                    }).setView([latitude, longitude], 13);

                    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                        attribution: "&copy; OpenStreetMap contributors"
                    }).addTo(map);

                    L.marker([latitude, longitude]).addTo(map);
                });
            }
        </script>
    </body>
</html>
